version: "2"

run:
  timeout: 5m
  # The live driver and the evals are behind build tags. Without these
  # the linter never sees them. No file uses a negated constraint, so
  # both can be on at once.
  build-tags: [live, evals]

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - forbidigo
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    forbidigo:
      # Stdout carries only MCP JSON-RPC frames: the stdio transport says
      # the server MUST NOT write anything else there. One stray print
      # corrupts the stream and the client silently stops working.
      #
      # Check the MESSAGE TEXT when verifying this works: a settings block
      # that fails to load leaves forbidigo on its defaults, firing,
      # looking like it works.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: "stdout carries only MCP JSON-RPC frames; write to an io.Writer the caller passed in, or slog to stderr"
        - pattern: ^os\.Stdout$
          msg: "only main names the process's streams; take an io.Writer instead"
    gocyclo:
      min-complexity: 25
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: unused-parameter
        - name: empty-block
        - name: unreachable-code
  exclusions:
    rules:
      # main names the process's streams once and passes them down, and
      # scripts/ is maintainer tooling rather than the server.
      - path: ^cmd/google-mail-mcp/
        linters: [forbidigo]
      - path: ^scripts/
        linters: [forbidigo, gosec]
      - path: _test\.go$
        linters: [gocyclo, unparam, errcheck, bodyclose, revive, prealloc, gosec]
      # The in-memory mailbox is test scaffolding.
      - path: ^internal/gapi/gmailtest/
        linters: [revive, gosec, errcheck]

formatters:
  enable:
    - gofmt
